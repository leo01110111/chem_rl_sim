[project]
name = "chem-rl-sim"
version = "0.1.0"
description = "Chemistry-bench MuJoCo scene (scale, glass cups, dropper) on the UR gantry sim, with a Gymnasium env"
requires-python = ">=3.12"
dependencies = [
    "urgantry-sim",
    "gymnasium>=1.3.0",
    "mujoco>=3.9.0",
    "numpy",
    "trimesh>=4.4",
    "imageio[ffmpeg]>=2.34",
    "pillow",
    "coacd>=1.0.14",
]

[project.optional-dependencies]
assets = ["objaverse>=0.1.7", "opencv-python>=4.10", "scipy"]

[tool.uv.sources]
urgantry-sim = { path = "third_party/urgantry_sim", editable = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.setuptools.packages.find]
include = ["chem_rl_sim*"]

[tool.setuptools.package-data]
chem_rl_sim = ["assets/**/*", "robotiq_2f85/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
